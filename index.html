<style>:root {  --wine:#641b2b;  --wine-dark:#39101a;  --gold:#c69a58;  --cream:#fff8f0;  --line:#e7c9ad;  --text:#421a22;}*{box-sizing:border-box}body{  margin:0;  background:linear-gradient(140deg,#fffaf4,#f4e1d6);  color:var(--text);  font-family:Tahoma,Arial,sans-serif;}header{text-align:center;padding:25px 15px 12px}.logo{  width:90px;height:90px;margin:auto auto 8px;  border:2px solid var(--gold);border-radius:50%;  display:grid;place-items:center;  font-family:Georgia,serif;font-size:43px;color:var(--wine);  background:#fffaf4;}.brand{font-family:Georgia,serif;letter-spacing:4px;font-size:21px}.tagline{font-size:11px;letter-spacing:2px;margin-top:5px}h1{font-size:25px;color:var(--wine);margin:20px 0 5px}.subtitle{font-size:13px;color:#78545a}main{  width:min(1100px,94%);margin:15px auto 35px;  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.9fr);  gap:18px;align-items:start;}.panel{  background:#fffaf5e8;border:1px solid var(--line);  border-radius:20px;padding:20px;box-shadow:0 8px 25px #641b2b0d;}.panel h2{  margin:-4px 0 20px;background:var(--wine);color:white;  border-radius:12px;padding:13px;text-align:center;font-size:18px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:bold}input,select,textarea{  width:100%;border:1px solid #d9c1b0;border-radius:10px;  padding:12px;background:#fffdf9;color:var(--text);  font:inherit;font-size:14px;min-width:0;}textarea{resize:vertical;min-height:85px}input:focus,select:focus,textarea:focus{  outline:2px solid #c69a5877;border-color:var(--gold)}.hint{font-size:11px;color:#866b68;line-height:1.8}button{  border:0;border-radius:11px;padding:13px 16px;  font:inherit;font-weight:bold;cursor:pointer;}.primary{background:var(--wine);color:white;width:100%;margin-top:18px}.secondary{background:#f1dfce;color:var(--wine)}.gold{background:var(--gold);color:#29140d}.payment-item{  border:1px solid var(--line);border-radius:11px;  padding:12px;margin-bottom:9px;background:#fffdf8}.payment-item strong{display:block;margin-bottom:5px}.account{font-size:12px;overflow-wrap:anywhere;direction:ltr;text-align:left}.social{line-height:2.2;font-size:13px}.notice{  background:#f7ebdf;border-radius:12px;padding:12px;  font-size:12px;line-height:1.9;margin-top:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.preview{margin-top:20px}#bookingCanvas{width:100%;border:1px solid var(--line);border-radius:12px;background:white}footer{text-align:center;padding:20px;color:#805e5d;font-size:12px}@media(max-width:760px){  main{grid-template-columns:1fr}  .grid{grid-template-columns:1fr}  .field.full{grid-column:auto}  h1{font-size:22px}}
.location-tools{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.map-btn{background:#f1dfce;color:var(--wine);border:1px solid var(--line);white-space:nowrap}.location-summary{background:#f8ece4;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.8;margin-top:8px}.location-summary strong{color:var(--wine)}.permission-status{font-size:12px;color:#866b68;margin-top:7px}.map-link{display:inline-block;margin-top:6px;color:#641b2b;font-weight:bold;text-decoration:none}#mapModal{position:fixed;inset:0;background:#24101899;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}#mapModal.open{display:flex}.map-dialog{width:min(720px,100%);background:#fffaf5;border-radius:20px;padding:16px;box-shadow:0 20px 60px #0005}.map-dialog h3{margin:0 0 10px;color:var(--wine)}#map{height:390px;border-radius:14px;border:1px solid var(--line);overflow:hidden}.map-actions{display:flex;gap:8px;margin-top:10px}.review-panel{margin-top:18px;border:2px solid var(--gold);border-radius:16px;padding:16px;background:#fffaf5}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.review-grid div{background:#f8ece4;border-radius:9px;padding:9px}.review-grid b{display:block;color:var(--wine);margin-bottom:3px}.review-full{grid-column:1/-1}.review-actions{display:flex;gap:9px;margin-top:12px}.review-actions button{flex:1}@media(max-width:600px){.location-tools{grid-template-columns:1fr}.review-grid{grid-template-columns:1fr}.review-full{grid-column:auto}.map-actions{flex-wrap:wrap}.map-actions button{flex:1}}.logo.logo-image{width:150px;height:150px;border-radius:24px;overflow:hidden;padding:0;background:#fffaf4;box-shadow:0 7px 22px #641b2b22}.logo.logo-image img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<header>  
  <div class="logo logo-image">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAQACAYAAAB/HSuDAABxZmNhQlgAAHFmanVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAcUBqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmFmMzNiOWUxLTRkZTctNDhlYS1iMjYzLWE0ZjhhZTRlNTA4ZQAAACEcanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAJ0Wp1bWIAAAA7anVtZEDLDDK7ikidpwsq1vR/Q2kTYzJwYS5pY29uAAAAABhjMnNoeOte9fdDOcAxOg4VlUCo5AAAABdiZmRiAGltYWdlL3N2Zyt4bWwAAAAJd2JpZGI8c3ZnIHdpZHRoPSI3MTYiIGhlaWdodD0iNzE2IiB2aWV3Qm94PSIwIDAgNzE2IDcxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTUwOC43NDkgMzE3LjM5OUM1MTYK..." alt="Logo">
  </div>
  <div class="brand">AS الجمانة ستايلك</div>
  <div class="tagline">حجز موعد الخدمات</div>
</header>

<main>
  <!-- قسم نموذج الحجز -->
  <section class="panel">
    <h2>نموذج حجز الموعد</h2>
    <form id="bookingForm">
      <div class="grid">
        <div class="field">
          <label for="clientName">الاسم الكامل</label>
          <input type="text" id="clientName" required placeholder="أدخل اسمك الكريم">
        </div>
        <div class="field">
          <label for="clientPhone">رقم الجوال</label>
          <input type="tel" id="clientPhone" required placeholder="05xxxxxxxx">
        </div>
        
        <!-- حقل اختيار الموقع مع الأزرار -->
        <div class="field full">
          <label>موقع الخدمة / عنوان العميل</label>
          <div class="location-tools">
            <input type="text" id="clientLocation" placeholder="اضغط على زر الخريطة أو تحديد الموقع" readonly>
            <button type="button" id="openMapBtn" class="map-btn">اختر من الخريطة</button>
          </div>
          <div class="permission-status" id="locationStatus">انقر لتحديد موقعك الحالي أو اختر من الخريطة التفاعلية.</div>
        </div>
      </div>

      <button type="submit" class="primary">تأكيد الحجز</button>
    </form>
  </section>

  <!-- نافذة الخريطة المنبثقة (Modal) -->
  <div id="mapModal">
    <div class="map-dialog">
      <h3>اختر موقعك على الخريطة</h3>
      <div id="map"></div>
      <div class="map-actions">
        <button type="button" id="confirmLocationBtn" class="primary" style="margin-top:0;">تأكيد هذا الموقع</button>
        <button type="button" id="closeMapBtn" class="secondary">إغلاق</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>جميع الحقوق محفوظة &copy; 2026 AS الجمانة ستايلك</p>
</footer>

<!-- مكتبة Leaflet للخرائط (JavaScript) -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let map, marker;
  let selectedLat = 26.5653; // افتراضياً (مثال: المنطقة الشرقية / السعودية)
  let selectedLng = 50.0829;

  const mapModal = document.getElementById('mapModal');
  const openMapBtn = document.getElementById('openMapBtn');
  const closeMapBtn = document.getElementById('closeMapBtn');
  const confirmLocationBtn = document.getElementById('confirmLocationBtn');
  const clientLocationInput = document.getElementById('clientLocation');
  const locationStatus = document.getElementById('locationStatus');

  // فتح نافذة الخريطة
  openMapBtn.addEventListener('click', () => {
    mapModal.classList.add('open');
    if (!map) {
      // تهيئة الخريطة إذا لم يتم إنشاؤها مسبقاً
      map = L.map('map').setView([selectedLat, selectedLng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      marker = L.marker([selectedLat, selectedLng], { draggable: true }).addTo(map);

      // تحديث الإحداثيات عند سحب العلامة
      marker.on('dragend', function (e) {
        const coord = marker.getLatLng();
        selectedLat = coord.lat;
        selectedLng = coord.lng;
      });

      // النقر على الخريطة لتحديث مكان العلامة
      map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        selectedLat = e.latlng.lat;
        selectedLng = e.latlng.lng;
      });
    } else {
      map.invalidateSize();
    }
  });

  // إغلاق نافذة الخريطة
  closeMapBtn.addEventListener('click', () => {
    mapModal.classList.remove('open');
  });

  // تأكيد الموقع المختار
  confirmLocationBtn.addEventListener('click', () => {
    clientLocationInput.value = `خط العرض: ${selectedLat.toFixed(4)}, خط الطول: ${selectedLng.toFixed(4)}`;
    locationStatus.textContent = "تم تحديد الموقع بنجاح عبر الخريطة.";
    mapModal.classList.remove('open');
  });
</script>
</body>
